[project]
name = "phishing-rehearsal"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "clawops[agent]==0.71.0",
    "fastapi==0.162.0",
    "faster-whisper==1.2.1",
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
